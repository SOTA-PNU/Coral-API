name: coral docker CI (from scratch)

# 매 실행마다 도커 이미지를 처음부터 빌드하고, 파이프라인을 돌린 뒤 이미지를 지운다.
# 툴체인(torch-mlir/IREE/CoralNPU)이 전부 이미지 안에서 소스 빌드되므로
# 러너 호스트에는 docker 와 데이터셋만 있으면 된다.

on:
  workflow_dispatch:
    inputs:
      models:
        description: '모델 선택 (--quick | --real | --all | "lenet5 charrnn")'
        default: '--quick'
      no_cache:
        description: 'BuildKit 캐시 무시하고 완전 재빌드 (3~6시간)'
        type: boolean
        default: false
  schedule:
    # 무캐시 재현성 검증은 주 1회로 충분하다. UTC 17:00 일요일 = KST 월요일 02:00
    - cron: '0 17 * * 0'

permissions:
  contents: read

concurrency:
  # 도커 빌드가 머신 자원을 크게 쓴다. 동시 실행을 막는다.
  group: coral-docker
  cancel-in-progress: false

jobs:
  build-run-destroy:
    runs-on: [self-hosted, linux, X64, coral-docker]
    # 첫 빌드(LLVM 2회 + bazel)를 감안한 상한.
    timeout-minutes: 480

    steps:
      - uses: actions/checkout@v4

      - name: 사전 점검
        run: |
          docker version --format '{{.Server.Version}}'
          echo "디스크:"; df -h /var/lib/docker /mnt/data 2>/dev/null | tail -3
          test -d "${CORAL_DATA:-/mnt/data/jiho/coral-data/data}" \
            || { echo "!! 데이터셋 없음 — ci-docker/fetch-data.sh 를 먼저 실행"; exit 1; }
        env:
          CORAL_DATA: /mnt/data/jiho/coral-data/data

      - name: 빌드 → 실행 → 삭제
        env:
          CORAL_DATA: /mnt/data/jiho/coral-data/data
          OUT_DIR: ${{ github.workspace }}/ci-artifacts
        run: |
          ARGS="${{ inputs.models || '--quick' }}"
          [ "${{ inputs.no_cache }}" = "true" ] && ARGS="--no-cache $ARGS"
          ./ci-docker/run-ci.sh $ARGS

      - name: 요약
        if: always()
        run: |
          { echo '### coral docker CI'
            echo '```'
            tail -n 40 ci-artifacts/run_lenet5.log 2>/dev/null || echo '(로그 없음)'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-docker-${{ github.run_id }}
          path: ci-artifacts/
          retention-days: 14

      - name: 이미지 잔재 확인
        if: always()
        run: |
          # run-ci.sh 의 trap 이 지우지만, 중단된 실행의 잔재를 한 번 더 청소한다.
          docker images --filter 'reference=coral-ci:*' --format '{{.Repository}}:{{.Tag}}' \
            | xargs -r docker rmi -f || true
          docker image prune -f || true
          echo "남은 coral-ci 이미지: $(docker images --filter 'reference=coral-ci:*' -q | wc -l)"
          df -h /var/lib/docker | tail -1
