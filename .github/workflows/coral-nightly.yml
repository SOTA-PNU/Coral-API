name: coral real

on:
  schedule:
    # cron 은 UTC 다. 17:00 UTC = KST 새벽 2시.
    - cron: '0 17 * * *'
  workflow_dispatch:
    inputs:
      models:
        description: '비우면 --real. 예) --all 또는 "lenet5 yolov3_tiny"'
        default: '--real'

permissions:
  contents: read

concurrency:
  # PR 잡과 같은 group — 벤치를 동시에 잡지 않는다. 다만 진행 중인 35분을 끊지는 않는다.
  group: coral-bench
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: lowering

env:
  CORAL_ROOT: ${{ github.workspace }}/lowering
  CORALNPU_DIR: /workspace/coralnpu
  IREE_BUILD_DIR: /workspace/iree-build
  IREE_SRC_DIR: /workspace/iree

jobs:
  real:
    runs-on: [self-hosted, linux, X64, coral]
    # yolov3_tiny 하나가 약 27분. --all 이면 3시간까지 본다.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: 데이터셋 연결
        run: ln -sfn /workspace/lowering-project/data "$CORAL_ROOT/data"

      # 어느 툴체인 리비전으로 검사했는지 남긴다. iree 소스와 iree-build 는
      # 같은 리비전이어야 VM ABI 가 맞는데, CI 는 그 갱신을 스스로 알 수 없다.
      - name: 툴체인 리비전 기록
        run: |
          echo "iree     $(git -C "$IREE_SRC_DIR" rev-parse --short HEAD 2>/dev/null || echo '?')"
          echo "coralnpu $(git -C "$CORALNPU_DIR" rev-parse --short HEAD 2>/dev/null || echo '?')"

      - name: real
        # 입력은 env 로 받는다. run 본문에 ${{ }} 를 직접 펼치면 셸 주입 통로가 된다.
        env:
          ARGS: ${{ inputs.models || '--real' }}
        # --deadline 을 job timeout 보다 낮게 잡아, 시뮬레이터가 매달려도
        # Actions 강제 종료 전에 coral.sh 가 로그를 남기고 끝나게 한다.
        run: ./coral.sh $ARGS --keep-going --deadline 5400 2>&1 | tee real.out

      - name: 요약
        if: always()
        run: |
          { echo '### real'; echo '```'
            tail -n 60 real.out 2>/dev/null || echo '(로그 없음)'
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coral-real-${{ github.run_id }}
          path: |
            lowering/real.out
            lowering/run_*.log
            lowering/build_*.log
            lowering/build/*/manifest.json
            lowering/build/*/chip_output.bin
          retention-days: 30

      - name: 정리
        if: always()
        run: rm -rf "$CORAL_ROOT/build"
